name: 🔍 Detection miss / 検出漏れ
description: namemask がマスクすべき固有名詞を見逃した / A PII entity was not masked
title: "[miss] "
labels: ["detection-miss"]
body:
  - type: markdown
    attributes:
      value: |
        検出漏れの報告は**最も価値の高い貢献**です。ありがとうございます。

        ⚠️ **実在の人名・企業名・住所・電話番号を絶対に貼らないでください。**
        必ず架空名に置き換えた再現ケースにしてください
        （例: `株式会社サンプル商事` / `佐々木` / `example.co.jp`）。

        再現できない場合は「問題の形」だけ書いてください
        （例:「ひらがな表記の姓＋課長」）。実テキストは不要です。
  - type: checkboxes
    id: fictional
    attributes:
      label: 確認
      options:
        - label: 以下の入力に実在の個人・企業の情報は含まれていない（架空名のみ）
          required: true
  - type: textarea
    id: input
    attributes:
      label: 入力（架空名のみ）/ Input
      render: text
      placeholder: |
        株式会社サンプル商事
        営業部 山田太郎
        TEL: 03-1234-5678
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する検出 / Expected
      render: text
      placeholder: |
        株式会社サンプル商事 → ORGANIZATION
        山田太郎             → PERSON（敬称が付かないので現状は取れない）
        03-1234-5678         → PHONE
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の出力 / Actual
      description: "`namemask mask` の出力をそのまま貼ってください"
      render: text
    validations:
      required: true
  - type: dropdown
    id: layers
    attributes:
      label: 有効にしていた層 / Layers enabled
      multiple: true
      options:
        - deterministic only (default)
        - dictionary (--clients)
        - address (--address)
        - NER (GiNZA)
        - LLM verifier (--llm)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: namemask のバージョン
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 実行環境 / Environment
      placeholder: "Python 3.12 / Windows 11"
    validations:
      required: true
