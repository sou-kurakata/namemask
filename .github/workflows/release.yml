name: Release

# `v0.1.0` のようなタグを push したときだけ走る。
# **PyPI への publish は取り消せない**（同一バージョンの再アップロード不可、
# 削除しても名前を再利用できない）。したがってこのワークフローは
# 「検査してから publish する」順序を厳格に守る。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  # ---- publish の前に、公開してよい状態かを全部確かめる ----
  verify:
    name: verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,crypto]"

      # タグと pyproject の version がずれたまま publish すると、取り消せない形で
      # 間違ったバージョンが出る。ここで止める。
      - name: タグと version が一致すること
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag / pyproject=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::タグ($tag) と version($ver) が不一致"; exit 1; }
          grep -q "^## \[$ver\] - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md に [$ver] の見出しが無い"; exit 1; }

      - name: テスト（NER / LLM は skip）
        run: python -m pytest -m "not ner and not llm" -ra
      - name: lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: 精度の閾値と docs の数値
        shell: bash
        run: |
          set -o pipefail
          python tests/eval.py --address --assert-thresholds --check-docs

      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

      # 配布物に機密が入っていないこと（CI の secrets-guard と同じ検査）。
      - name: sdist / wheel に機密が入っていないこと
        shell: bash
        run: |
          set -euo pipefail
          list=$(tar tzf dist/*.tar.gz; python -m zipfile -l dist/*.whl | awk '{print $1}')
          if echo "$list" | grep -E 'data/(clients|persons)\.csv|\.mapping\.json|(^|/)\.session/|\.env$'; then
            echo "::error::配布物に機密ファイルが含まれている"; exit 1
          fi
          if python -m zipfile -l dist/*.whl | grep -E 'tests/|data/|config\.yaml'; then
            echo "::error::wheel に配布対象外のファイルが含まれている"; exit 1
          fi
          echo "配布物は clean"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ---- publish だけを分けて、id-token を持つ範囲を最小にする ----
  publish:
    name: publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi        # PyPI の trusted publisher 設定と一致させること
    permissions:
      id-token: write        # OIDC。API トークンはリポジトリに置かない
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
