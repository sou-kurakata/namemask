name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 必須ゲート: コア + CLI ----
  # Windows / macOS も必須にする。主要な利用者が Windows で、パス・エンコーディング
  # 周りの退行をここで捕まえたい（旧プロトタイプは Windows 前提で書かれていた）。
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,crypto]"
      - name: Test (NER / LLM は skip)
        run: python -m pytest -m "not ner and not llm" -ra

  # ---- 必須ゲート: lint ----
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests

  # ---- 必須ゲート: 精度の閾値 ----
  eval:
    name: accuracy thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,crypto]"
      - name: Evaluate deterministic layers
        shell: bash
        # pipefail が無いとパイプの終了コードは tee のもの（常に 0）になり、
        # **閾値を割っても緑になる**。このゲートの意味そのものが消えるので必須。
        run: |
          set -o pipefail
          python tests/eval.py --address --assert-thresholds --check-docs | tee eval.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: eval.txt

  # ---- 必須ゲート: 機密混入チェック ----
  secrets-guard:
    name: secrets guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 追跡してはいけないファイルが無いこと
        run: |
          set -e
          fail=0
          for f in data/clients.csv data/persons.csv; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f は追跡してはいけない（機密マスタ）"; fail=1
            fi
          done
          if git ls-files | grep -E '\.mapping\.json$|^\.session/'; then
            echo "::error::mapping / .session が追跡されている（生の機密）"; fail=1
          fi
          exit $fail

  # ---- 必須ゲート: 実際に pip install して動くこと ----
  smoke:
    name: install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      # 辞書ファイル無し・モデル無しで round-trip が通ること
      # （README の Quickstart がこれを前提にしている）
      - name: mask and unmask round-trip with no dictionary
        run: |
          set -e
          printf '株式会社サンプル商事の田中様、電話 03-1234-5678\n' > in.txt
          namemask mask in.txt -o masked.txt
          echo "--- masked ---"; cat masked.txt
          grep -q '\[\[' masked.txt || { echo "::error::プレースホルダが出ていない"; exit 1; }
          if grep -q 'サンプル商事' masked.txt; then echo "::error::原文が漏れている"; exit 1; fi
          namemask unmask masked.txt -m .session/mapping.json -o out.txt
          diff in.txt out.txt && echo "round-trip OK"
